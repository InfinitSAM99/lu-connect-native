name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is empty"
            exit 1
          fi
          echo "EXPO_TOKEN is set (length: ${#EXPO_TOKEN})"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK locally
        run: |
          export EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}
          eas build --platform android --profile preview --local --non-interactive --output=./build.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lu-connect-apk
          path: ./build.apk
