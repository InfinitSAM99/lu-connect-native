name: Get Keystore Fingerprint

on:
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/lu-connect-native.keystore

      - name: Get SHA-256 Fingerprint
        run: |
          keytool -list -v \
            -keystore $RUNNER_TEMP/lu-connect-native.keystore \
            -alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.ANDROID_KEY_PASSWORD }} \
            | grep "SHA256:"
